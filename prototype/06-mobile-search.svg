<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1120" viewBox="0 0 390 1120" role="img"><title>Mobile 390px search specification with vertical filters and tutor card</title><desc>Design specification only. Sample data. Not an implemented application.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#66748C"/></marker></defs><g font-family="Arial, sans-serif"><rect x="0" y="0" width="390" height="1120" rx="0" fill="#F5F7FB" stroke="#F5F7FB"/><rect x="0" y="0" width="390" height="84" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="24" y="49" font-size="25" fill="#2563EB" font-weight="800">TutorGo.kz</text><text x="24" y="133" font-size="28" fill="#17233C" font-weight="750">Репетиторы</text><text x="24" y="168" font-size="14" fill="#66748C" font-weight="400">Математика · ЕНТ · онлайн</text><text x="24" y="1090" font-size="12" fill="#66748C" font-weight="400">Учебный макет · все данные демонстрационные</text><rect x="24" y="198" width="342" height="140" rx="16" fill="#FFFFFF" stroke="#DCE3EF"/><text x="44" y="232" font-size="17" fill="#17233C" font-weight="600">Бюджет · 3 000–8 000 ₸</text><text x="44" y="264" font-size="16" fill="#66748C" font-weight="400">После 16:00 · UTC+5</text><rect x="44" y="282" width="302" height="48" rx="12" fill="#FFFFFF" stroke="#DCE3EF"/><text x="62" y="312" font-size="16" fill="#2563EB" font-weight="600">Изменить фильтры</text><rect x="24" y="358" width="245" height="32" rx="16" fill="#EDF3FF" stroke="#EDF3FF"/><text x="37" y="380" font-size="14" fill="#2563EB" font-weight="600">Только проверенные документы</text><rect x="24" y="410" width="342" height="397" rx="16" fill="#FFFFFF" stroke="#DCE3EF"/><circle cx="74" cy="464" r="30" fill="#E0EAFE"/><text x="56" y="473" font-size="22" fill="#2563EB" font-weight="700">АК</text><text x="120" y="461" font-size="24" fill="#17233C" font-weight="700">Айдана К.</text><text x="120" y="490" font-size="15" fill="#66748C" font-weight="400">Математика · ЕНТ</text><text x="44" y="545" font-size="17" fill="#66748C" font-weight="400">4,9 · 24 отзыва</text><rect x="44" y="566" width="245" height="32" rx="16" fill="#E6F5EF" stroke="#E6F5EF"/><text x="57" y="588" font-size="14" fill="#11795D" font-weight="600">Документы проверены</text><text x="44" y="638" font-size="17" fill="#66748C" font-weight="400">Ближайший слот:</text><text x="44" y="667" font-size="17" fill="#66748C" font-weight="400">24 октября · 16:00–17:00</text><text x="44" y="713" font-size="24" fill="#17233C" font-weight="700">6 000 ₸ / 60 минут</text><rect x="44" y="738" width="302" height="48" rx="12" fill="#2563EB" stroke="#2563EB"/><text x="62" y="768" font-size="16" fill="#FFFFFF" font-weight="600">Профиль и время</text><rect x="24" y="833" width="342" height="186" rx="16" fill="#EDF3FF" stroke="#EDF3FF"/><text x="44" y="873" font-size="20" fill="#2563EB" font-weight="650">Нет подходящего времени?</text><text x="44" y="910" font-size="16" fill="#66748C" font-weight="400">Расширьте время или бюджет.</text><text x="44" y="939" font-size="16" fill="#66748C" font-weight="400">Фильтры можно сбросить.</text><text x="44" y="968" font-size="16" fill="#66748C" font-weight="400">Заявка не означает оплату.</text></g></svg>