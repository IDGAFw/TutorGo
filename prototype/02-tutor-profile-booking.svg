<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img"><title>Tutor profile, available slots and request pending tutor acceptance</title><desc>Design specification only. Sample data. Not an implemented application.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#66748C"/></marker></defs><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1440" height="1080" rx="0" fill="#F5F7FB" stroke="#F5F7FB"/><rect x="0" y="0" width="1440" height="84" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="56" y="49" font-size="25" fill="#2563EB" font-weight="800">TutorGo.kz</text><text x="310" y="48" font-size="16" fill="#17233C" font-weight="400">Найти репетитора</text><text x="545" y="48" font-size="16" fill="#66748C" font-weight="400">Мои занятия</text><text x="720" y="48" font-size="16" fill="#66748C" font-weight="400">Сообщения</text><rect x="1160" y="25" width="220" height="32" rx="16" fill="#EDF3FF" stroke="#EDF3FF"/><text x="1173" y="47" font-size="14" fill="#2563EB" font-weight="600">UX prototype · sample data</text><text x="56" y="148" font-size="36" fill="#17233C" font-weight="750">Профиль репетитора</text><text x="56" y="185" font-size="18" fill="#66748C" font-weight="400">Поиск → профиль → заявка → подтверждение и оплата</text><text x="56" y="1050" font-size="15" fill="#66748C" font-weight="400">Учебный макет · все данные демонстрационные</text><rect x="56" y="222" width="820" height="238" rx="16" fill="#FFFFFF" stroke="#DCE3EF"/><circle cx="114" cy="282" r="30" fill="#E0EAFE"/><text x="96" y="291" font-size="22" fill="#2563EB" font-weight="700">АК</text><text x="170" y="285" font-size="30" fill="#17233C" font-weight="700">Айдана К.</text><text x="170" y="319" font-size="19" fill="#66748C" font-weight="400">Математика · ЕНТ · опыт 6 лет</text><rect x="170" y="340" width="224" height="32" rx="16" fill="#E6F5EF" stroke="#E6F5EF"/><text x="183" y="362" font-size="14" fill="#11795D" font-weight="600">Документы проверены</text><text x="170" y="409" font-size="17" fill="#66748C" font-weight="400">4,9 · 24 отзыва после занятий</text><rect x="56" y="484" width="820" height="224" rx="16" fill="#FFFFFF" stroke="#DCE3EF"/><text x="84" y="525" font-size="24" fill="#17233C" font-weight="700">Об уроках</text><text x="84" y="566" font-size="18" fill="#66748C" font-weight="400">Помогаю разобрать школьную программу и подготовиться к ЕНТ.</text><text x="84" y="595" font-size="18" fill="#66748C" font-weight="400">На первой встрече определим цель и составим план занятий.</text><text x="84" y="624" font-size="18" fill="#66748C" font-weight="400">Формат: онлайн, 60 минут. Язык: русский.</text><text x="84" y="653" font-size="18" fill="#66748C" font-weight="400">Образование и отзывы доступны в отдельных разделах.</text><rect x="56" y="732" width="820" height="237" rx="16" fill="#FFFFFF" stroke="#DCE3EF"/><text x="84" y="774" font-size="23" fill="#17233C" font-weight="700">Выберите свободное время</text><text x="84" y="806" font-size="17" fill="#66748C" font-weight="400">24 октября 2026 · UTC+5</text><rect x="84" y="831" width="180" height="48" rx="12" fill="#2563EB" stroke="#2563EB"/><text x="102" y="861" font-size="16" fill="#FFFFFF" font-weight="600">16:00–17:00</text><rect x="282" y="831" width="180" height="48" rx="12" fill="#FFFFFF" stroke="#DCE3EF"/><text x="300" y="861" font-size="16" fill="#2563EB" font-weight="600">18:00–19:00</text><rect x="84" y="902" width="290" height="32" rx="16" fill="#F1F3F7" stroke="#F1F3F7"/><text x="97" y="924" font-size="14" fill="#66748C" font-weight="600">17:00–18:00 · уже занято</text><rect x="904" y="222" width="480" height="562" rx="16" fill="#FFFFFF" stroke="#DCE3EF"/><text x="932" y="269" font-size="34" fill="#17233C" font-weight="750">6 000 ₸</text><text x="932" y="302" font-size="18" fill="#66748C" font-weight="400">за 60 минут · онлайн</text><text x="932" y="352" font-size="15" fill="#66748C" font-weight="400">Выбрано</text><text x="932" y="385" font-size="22" fill="#17233C" font-weight="650">24 октября, 16:00–17:00</text><text x="932" y="432" font-size="17" fill="#66748C" font-weight="400">1. Отправьте заявку на выбранный слот.</text><text x="932" y="461" font-size="17" fill="#66748C" font-weight="400">2. Дождитесь согласия репетитора.</text><text x="932" y="490" font-size="17" fill="#66748C" font-weight="400">3. Оплатите в тестовом режиме.</text><text x="932" y="519" font-size="17" fill="#66748C" font-weight="400">Бронь подтверждена после обоих шагов.</text><rect x="932" y="565" width="424" height="48" rx="12" fill="#2563EB" stroke="#2563EB"/><text x="950" y="595" font-size="16" fill="#FFFFFF" font-weight="600">Отправить заявку</text><text x="932" y="652" font-size="16" fill="#66748C" font-weight="400">Слот занят? Покажем новые варианты.</text><text x="932" y="681" font-size="16" fill="#66748C" font-weight="400">Срок ответа и оплаты виден в заявке.</text><text x="932" y="710" font-size="16" fill="#66748C" font-weight="400">Повторный клик не создаёт вторую бронь.</text><rect x="904" y="810" width="480" height="159" rx="16" fill="#FFF5E7" stroke="#FFF5E7"/><text x="932" y="851" font-size="21" fill="#8E570D" font-weight="650">Заявка отправлена</text><text x="932" y="887" font-size="16" fill="#66748C" font-weight="400">Статус: ожидает ответа репетитора.</text><text x="932" y="916" font-size="16" fill="#66748C" font-weight="400">Оплата станет доступна после согласия.</text></g></svg>