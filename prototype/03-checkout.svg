<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img"><title>Sandbox checkout with tutor acceptance, success, failure and late-payment states</title><desc>Design specification only. Sample data. Not an implemented application.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#66748C"/></marker></defs><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1440" height="1080" rx="0" fill="#F5F7FB" stroke="#F5F7FB"/><rect x="0" y="0" width="1440" height="84" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="56" y="49" font-size="25" fill="#2563EB" font-weight="800">TutorGo.kz</text><text x="310" y="48" font-size="16" fill="#17233C" font-weight="400">Найти репетитора</text><text x="545" y="48" font-size="16" fill="#66748C" font-weight="400">Мои занятия</text><text x="720" y="48" font-size="16" fill="#66748C" font-weight="400">Сообщения</text><rect x="1160" y="25" width="220" height="32" rx="16" fill="#EDF3FF" stroke="#EDF3FF"/><text x="1173" y="47" font-size="14" fill="#2563EB" font-weight="600">UX prototype · sample data</text><text x="56" y="148" font-size="36" fill="#17233C" font-weight="750">Подтверждение и оплата</text><text x="56" y="185" font-size="18" fill="#66748C" font-weight="400">Репетитор принял заявку · платёжный режим Sandbox</text><text x="56" y="1050" font-size="15" fill="#66748C" font-weight="400">Учебный макет · все данные демонстрационные</text><rect x="56" y="222" width="806" height="453" rx="16" fill="#FFFFFF" stroke="#DCE3EF"/><rect x="84" y="250" width="255" height="32" rx="16" fill="#E6F5EF" stroke="#E6F5EF"/><text x="97" y="272" font-size="14" fill="#11795D" font-weight="600">Согласие репетитора получено</text><text x="84" y="329" font-size="27" fill="#17233C" font-weight="700">Проверьте детали занятия</text><text x="84" y="380" font-size="19" fill="#66748C" font-weight="400">Айдана К. · математика · подготовка к ЕНТ</text><text x="84" y="409" font-size="19" fill="#66748C" font-weight="400">24 октября 2026 · 16:00–17:00 · UTC+5</text><text x="84" y="438" font-size="19" fill="#66748C" font-weight="400">Онлайн · ссылка появится в подтверждённой брони</text><text x="84" y="508" font-size="17" fill="#66748C" font-weight="400">Способ оплаты</text><rect x="84" y="530" width="750" height="64" rx="16" fill="#EDF3FF" stroke="#EDF3FF"/><text x="108" y="570" font-size="20" fill="#2563EB" font-weight="650">Тестовая страница платёжного провайдера</text><text x="84" y="637" font-size="16" fill="#66748C" font-weight="400">Реквизиты карты вводятся у провайдера, а не в TutorGo.</text><rect x="890" y="222" width="494" height="453" rx="16" fill="#FFFFFF" stroke="#DCE3EF"/><text x="920" y="275" font-size="25" fill="#17233C" font-weight="700">К оплате</text><text x="920" y="334" font-size="19" fill="#66748C" font-weight="400">Занятие · 60 минут</text><text x="920" y="402" font-size="42" fill="#17233C" font-weight="750">6 000 ₸</text><text x="920" y="453" font-size="17" fill="#66748C" font-weight="400">Демонстрационная сумма.</text><text x="920" y="482" font-size="17" fill="#66748C" font-weight="400">Реальные деньги не списываются.</text><text x="920" y="511" font-size="17" fill="#66748C" font-weight="400">До истечения срока: 14:32</text><rect x="920" y="565" width="434" height="48" rx="12" fill="#2563EB" stroke="#2563EB"/><text x="938" y="595" font-size="16" fill="#FFFFFF" font-weight="600">Перейти к тестовой оплате</text><rect x="56" y="709" width="644" height="240" rx="16" fill="#E6F5EF" stroke="#E6F5EF"/><text x="84" y="756" font-size="24" fill="#11795D" font-weight="700">Успех: занятие подтверждено</text><text x="84" y="802" font-size="18" fill="#66748C" font-weight="400">Бронь TG-DEMO-104 · платёж выполнен</text><text x="84" y="831" font-size="18" fill="#66748C" font-weight="400">Оплата учтена один раз.</text><text x="84" y="860" font-size="18" fill="#66748C" font-weight="400">Открыть «Мои занятия» → ссылка на урок</text><rect x="84" y="878" width="260" height="48" rx="12" fill="#2563EB" stroke="#2563EB"/><text x="102" y="908" font-size="16" fill="#FFFFFF" font-weight="600">Перейти к занятию</text><rect x="724" y="709" width="660" height="240" rx="16" fill="#FCEDEF" stroke="#FCEDEF"/><text x="752" y="756" font-size="24" fill="#B63C49" font-weight="700">Платёж не прошёл</text><text x="752" y="802" font-size="18" fill="#66748C" font-weight="400">Покажем причину и актуальный статус брони.</text><text x="752" y="831" font-size="18" fill="#66748C" font-weight="400">Повторная попытка использует ту же заявку.</text><text x="752" y="860" font-size="18" fill="#66748C" font-weight="400">Поздний платёж после отмены: проверка / возврат.</text><rect x="752" y="878" width="280" height="48" rx="12" fill="#FFFFFF" stroke="#DCE3EF"/><text x="770" y="908" font-size="16" fill="#2563EB" font-weight="600">Повторить попытку</text></g></svg>