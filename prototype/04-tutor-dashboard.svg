<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img"><title>Tutor request acceptance, availability exceptions and payout states</title><desc>Design specification only. Sample data. Not an implemented application.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#66748C"/></marker></defs><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1440" height="1080" rx="0" fill="#F5F7FB" stroke="#F5F7FB"/><rect x="0" y="0" width="1440" height="84" rx="0" fill="#FFFFFF" stroke="#FFFFFF"/><text x="56" y="49" font-size="25" fill="#2563EB" font-weight="800">TutorGo.kz</text><text x="310" y="48" font-size="16" fill="#17233C" font-weight="400">Найти репетитора</text><text x="545" y="48" font-size="16" fill="#66748C" font-weight="400">Мои занятия</text><text x="720" y="48" font-size="16" fill="#66748C" font-weight="400">Сообщения</text><rect x="1160" y="25" width="220" height="32" rx="16" fill="#EDF3FF" stroke="#EDF3FF"/><text x="1173" y="47" font-size="14" fill="#2563EB" font-weight="600">UX prototype · sample data</text><text x="56" y="148" font-size="36" fill="#17233C" font-weight="750">Кабинет репетитора</text><text x="56" y="185" font-size="18" fill="#66748C" font-weight="400">Заявки, расписание и выплаты</text><text x="56" y="1050" font-size="15" fill="#66748C" font-weight="400">Учебный макет · все данные демонстрационные</text><rect x="56" y="222" width="425" height="123" rx="16" fill="#FFFFFF" stroke="#DCE3EF"/><text x="80" y="263" font-size="17" fill="#66748C" font-weight="400">Заявки на ответ</text><text x="80" y="316" font-size="32" fill="#17233C" font-weight="750">2</text><rect x="505" y="222" width="425" height="123" rx="16" fill="#FFFFFF" stroke="#DCE3EF"/><text x="529" y="263" font-size="17" fill="#66748C" font-weight="400">Занятия на неделе</text><text x="529" y="316" font-size="32" fill="#17233C" font-weight="750">6</text><rect x="954" y="222" width="425" height="123" rx="16" fill="#FFFFFF" stroke="#DCE3EF"/><text x="978" y="263" font-size="17" fill="#66748C" font-weight="400">Ожидается к выплате</text><text x="978" y="316" font-size="32" fill="#17233C" font-weight="750">18 000 ₸</text><rect x="56" y="369" width="840" height="355" rx="16" fill="#FFFFFF" stroke="#DCE3EF"/><text x="84" y="414" font-size="25" fill="#17233C" font-weight="700">Новая заявка</text><rect x="692" y="391" width="172" height="32" rx="16" fill="#FFF1DA" stroke="#FFF1DA"/><text x="705" y="413" font-size="14" fill="#8E570D" font-weight="600">Ожидает ответа</text><text x="84" y="462" font-size="21" fill="#17233C" font-weight="650">Ученик A · математика · ЕНТ</text><text x="84" y="503" font-size="18" fill="#66748C" font-weight="400">24 октября · 16:00–17:00 · UTC+5</text><text x="84" y="532" font-size="18" fill="#66748C" font-weight="400">60 минут · 6 000 ₸ · онлайн</text><text x="84" y="561" font-size="18" fill="#66748C" font-weight="400">После согласия ученик сможет оплатить.</text><rect x="84" y="625" width="256" height="48" rx="12" fill="#2563EB" stroke="#2563EB"/><text x="102" y="655" font-size="16" fill="#FFFFFF" font-weight="600">Принять заявку</text><rect x="364" y="625" width="256" height="48" rx="12" fill="#FFFFFF" stroke="#DCE3EF"/><text x="382" y="655" font-size="16" fill="#2563EB" font-weight="600">Отклонить с причиной</text><rect x="920" y="369" width="464" height="355" rx="16" fill="#FFFFFF" stroke="#DCE3EF"/><text x="948" y="414" font-size="25" fill="#17233C" font-weight="700">Доступность</text><text x="948" y="462" font-size="17" fill="#66748C" font-weight="400">Пт / Сб · 16:00–20:00</text><text x="948" y="491" font-size="17" fill="#66748C" font-weight="400">Часовой пояс: UTC+5</text><text x="948" y="520" font-size="17" fill="#66748C" font-weight="400"></text><text x="948" y="549" font-size="17" fill="#66748C" font-weight="400">Исключение: 25 октября — выходной</text><text x="948" y="578" font-size="17" fill="#66748C" font-weight="400">Занятые интервалы не доступны</text><text x="948" y="607" font-size="17" fill="#66748C" font-weight="400">для повторной записи.</text><rect x="948" y="625" width="408" height="48" rx="12" fill="#FFFFFF" stroke="#DCE3EF"/><text x="966" y="655" font-size="16" fill="#2563EB" font-weight="600">Изменить расписание</text><rect x="56" y="748" width="1328" height="235" rx="16" fill="#FFFFFF" stroke="#DCE3EF"/><text x="84" y="792" font-size="23" fill="#17233C" font-weight="700">Ближайшее подтверждённое занятие</text><text x="84" y="839" font-size="20" fill="#17233C" font-weight="400">Ученик B · 23 октября · 18:00–19:00</text><rect x="84" y="864" width="234" height="32" rx="16" fill="#E6F5EF" stroke="#E6F5EF"/><text x="97" y="886" font-size="14" fill="#11795D" font-weight="600">Подтверждено и оплачено</text><rect x="1026" y="816" width="330" height="48" rx="12" fill="#2563EB" stroke="#2563EB"/><text x="1044" y="846" font-size="16" fill="#FFFFFF" font-weight="600">Открыть внешний урок</text><text x="84" y="946" font-size="17" fill="#66748C" font-weight="400">Выплата создаётся после завершённого оплаченного занятия; сумма и статус видны в истории.</text></g></svg>